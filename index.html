<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A36 Weight & Balance</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">
<header>
<h1>A36 Electronic Load Sheet</h1>
<p>Mass & CG Calculator. Please enter the required values below.</p>
</header>

<section class="card">
<h2>Basic Empty Condition</h2>
<div class="grid">
<label>Basic Empty Mass (kg) (Sample Value - 1012)</label><input id="bewMass" value="1012.5">
<label>Basic Empty CG (in) (Sample Value - 76.7)</label><input id="bewCg" value="76.7">
</div>
</section>

<section class="card">
<h2>Occupants</h2>
<div class="grid">
<label>Pilot (kg)</label><input id="pilot">
<label>Copilot (kg)</label><input id="copilot">
<label>Rear Seat FS115 (kg)</label><input id="rear1">
<label>Rear Seat FS120 (kg)</label><input id="rear2">
</div>
</section>

<section class="card">
<h2>Baggage</h2>
<div class="grid">
<label>Front baggage FS91 (kg, max 18)</label><input id="bag1">
<label>Aft baggage FS150 (kg, max 181)</label><input id="bag2">
</div>
</section>

<section class="card">
<h2>Fuel</h2>
<div class="grid">
<label>Fuel onboard (liters) (Standard max 189.27)</label><input id="fuel">
</div>
</section>

<button onclick="calculate()">Calculate</button>

<section class="card">
<h2>Results</h2>
<div id="out"></div>
</section>

<section class="card envelope-card">
<h2>Weight / CG Envelope</h2>
<div class="envelope-image">
  <img id="envelopeImage" src="envelope.png" alt="A36 Weight / CG Envelope">
</div>
</section>

</div>

<script src="app.js"></script>
</body>
</html>
